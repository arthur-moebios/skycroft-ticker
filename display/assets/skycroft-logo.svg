<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Skycroft">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ddc84"/>
      <stop offset="0.52" stop-color="#1fb6c9"/>
      <stop offset="1" stop-color="#2a7fff"/>
    </linearGradient>
    <clipPath id="badge"><rect x="8" y="8" width="104" height="104" rx="28"/></clipPath>
  </defs>
  <!-- badge + brilho de céu -->
  <g clip-path="url(#badge)">
    <rect x="8" y="8" width="104" height="104" fill="url(#sky)"/>
    <ellipse cx="60" cy="6" rx="84" ry="48" fill="#ffffff" opacity="0.12"/>
  </g>
  <!-- chevron: subida / céu / placar em alta -->
  <path d="M30 78 L60 46 L90 78" fill="none" stroke="#ffffff" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M44 88 L60 71 L76 88" fill="none" stroke="#ffffff" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <!-- brilho / estrela -->
  <path d="M86 24 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#ffffff"/>
</svg>
